# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: halo-cli
spec:
  enabled: true
  requires: ">=2.26.0"
  author:
    name: hanserwei
    website: https://github.com/hanserwei
  logo: logo.png
  homepage: https://github.com/hanserwei/halo-cli#readme
  repo: https://github.com/hanserwei/halo-cli
  issues: https://github.com/hanserwei/halo-cli/issues
  displayName: "Halo CLI"
  description: "在终端中管理 Halo 内容、主题配置和插件 Extension"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/hanserwei/halo-cli/blob/main/LICENSE"
