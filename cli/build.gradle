plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'com.hanserwei.halocli.cli'

tasks.register('pnpmBuild', PnpmTask) {
    group = 'build'
    description = 'Build the standalone Halo CLI bundle'
    args = ['build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(
        dir: layout.projectDirectory,
        includes: ['*.ts', '*.json', '*.yaml']))
    outputs.dir(layout.projectDirectory.dir('dist'))
}

tasks.register('pnpmCheck', PnpmTask) {
    group = 'verification'
    description = 'Run Halo CLI tests and type checks'
    args = ['check']
    dependsOn tasks.named('pnpmInstall')
}

tasks.named('check') {
    dependsOn tasks.named('pnpmCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}
